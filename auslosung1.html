        #draw-result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Auslosung 1</h1>
    <button class="button" onclick="generateDraw()">Auslosung</button>
    <button class="button" onclick="resetDraw()">Reset Auslosung</button>

    <div id="draw-result">
        <!-- Hier wird die Auslosung angezeigt -->
    </div>

    <script>
        const previousDraw = localStorage.getItem('auslosung1') || null;
        const existingMatches = JSON.parse(localStorage.getItem('matches')) || [];
        const teamsFromStorage = JSON.parse(localStorage.getItem('wattTeams')) || [];

        function matchExists(teamA, teamB, allMatches) {
            const directMatch = `${teamA} vs ${teamB}`;
            const reverseMatch = `${teamB} vs ${teamA}`;
            return allMatches.some(match => match === directMatch || match === reverseMatch);
        }

        function generateDraw() {
            if (teamsFromStorage.length < 2) {
                alert("Es müssen mindestens 2 Teams vorhanden sein, um eine Auslosung zu machen.");
                return;
            }

            const teamNames = teamsFromStorage.map(team => `${team.player1} / ${team.player2}`);
            const maxAttempts = 500;

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const shuffledTeams = shuffleArray([...teamNames]);
                const candidateMatches = [];
                let valid = true;

                for (let i = 0; i < shuffledTeams.length; i += 2) {
                    const teamA = shuffledTeams[i];
                    const teamB = shuffledTeams[i + 1];

                    if (!teamB) {
                        valid = false;
                        break;
                    }

                    if (matchExists(teamA, teamB, [...existingMatches, ...candidateMatches])) {
                        valid = false;
                        break;
                    }

                    candidateMatches.push(`${teamA} vs ${teamB}`);
                }

                if (valid) {
                    let drawHTML = '<table><tr><th>Team 1</th><th>vs</th><th>Team 2</th><th>Tisch</th></tr>';

                    candidateMatches.forEach((match, index) => {
                        const [teamA, teamB] = match.split(' vs ');
                        drawHTML += `<tr><td>${teamA}</td><td>vs</td><td>${teamB}</td><td>Tisch ${index + 1}</td></tr>`;
                    });

                    drawHTML += '</table>';

                    localStorage.setItem('auslosung1', drawHTML);
                    localStorage.setItem('matches', JSON.stringify([...existingMatches, ...candidateMatches]));
                    document.getElementById('draw-result').innerHTML = drawHTML;
                    return;
                }
            }

            alert("Es gibt keine mögliche Paarung mehr für diese Auslosung. Bitte machen Sie einen Reset für diese Auslosung und versuchen Sie es erneut.");
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (previousDraw) {
                document.getElementById('draw-result').innerHTML = previousDraw;
            }
        });

        function resetDraw() {
            localStorage.removeItem('auslosung1');
            localStorage.removeItem('matches');
            document.getElementById('draw-result').innerHTML = '';
            alert("Die Auslosung wurde zurückgesetzt.");
        }
    </script>

    <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/watt-turnier-app/service-worker.js")
        .catch(err => console.log("SW registration failed", err));
    }
    </script>
