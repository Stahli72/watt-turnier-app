<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auslosung 5</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .button { margin: 10px 0; padding: 5px 10px; background-color: #3656A7; color: white; border: none; cursor: pointer; }
        .button:hover { background-color: #3656A7; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid #000; }
        th, td { padding: 8px; text-align: center; }
        th { background-color: #3656A7; color: white; }
        td { background-color: #f2f2f2; }
        #draw-result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Auslosung 5</h1>
    <button class="button" onclick="generateDraw()">Auslosung</button>
    <button class="button" onclick="resetDraw()">Reset Auslosung</button>

    <div id="draw-result"></div>

    <script>
        const currentDrawKey = 'auslosung5';
        const currentDrawMatchesKey = 'auslosung5Matches';
        const allDrawMatchesKey = 'allDrawMatches';

        function getStoredArray(key) {
            try {
                return JSON.parse(localStorage.getItem(key)) || [];
            } catch (error) {
                return [];
            }
        }

        function normalizePair(teamA, teamB) {
            const left = String(teamA).trim();
            const right = String(teamB).trim();
            return [left, right].sort().join('||');
        }

        function pairKeyFromDisplay(match) {
            const matchText = String(match || '').trim();
            const [teamA, teamB] = matchText.split(' vs ');
            if (!teamA || !teamB) return null;
            return normalizePair(teamA.trim(), teamB.trim());
        }

        function getTeamNames() {
            const teams = JSON.parse(localStorage.getItem('wattTeams')) || [];
            return teams
                .filter(team => team && (team.player1 || team.player2))
                .map(team => `${team.player1} / ${team.player2}`);
        }

        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function renderTable(matches) {
            let tableHtml = '<table><tr><th>Team 1</th><th>vs</th><th>Team 2</th><th>Tisch</th></tr>';
            matches.forEach((match, index) => {
                const [teamA, teamB] = match.split(' vs ');
                tableHtml += `<tr><td>${teamA}</td><td>vs</td><td>${teamB}</td><td>Tisch ${index + 1}</td></tr>`;
            });
            tableHtml += '</table>';
            return tableHtml;
        }

        function generateDraw() {
            const teamNames = getTeamNames();
            if (teamNames.length < 2) {
                alert('Es müssen mindestens 2 Teams vorhanden sein, um eine Auslosung zu machen.');
                return;
            }

            const usedPairKeys = getStoredArray(allDrawMatchesKey);
            const maxAttempts = 500;

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const shuffledTeams = shuffleArray(teamNames);
                const candidateMatches = [];
                const candidateKeys = [];
                const seenTeams = new Set();
                let valid = true;

                for (let i = 0; i < shuffledTeams.length; i += 2) {
                    const teamA = shuffledTeams[i];
                    const teamB = shuffledTeams[i + 1];

                    if (!teamB) {
                        valid = false;
                        break;
                    }

                    if (seenTeams.has(teamA) || seenTeams.has(teamB)) {
                        valid = false;
                        break;
                    }

                    const pairKey = normalizePair(teamA, teamB);
                    if (usedPairKeys.includes(pairKey) || candidateKeys.includes(pairKey)) {
                        valid = false;
                        break;
                    }

                    candidateKeys.push(pairKey);
                    candidateMatches.push(`${teamA} vs ${teamB}`);
                    seenTeams.add(teamA);
                    seenTeams.add(teamB);
                }

                if (valid) {
                    const drawHtml = renderTable(candidateMatches);
                    const nextUsedPairKeys = Array.from(new Set([...usedPairKeys, ...candidateKeys]));

                    localStorage.setItem(currentDrawKey, drawHtml);
                    localStorage.setItem(currentDrawMatchesKey, JSON.stringify(candidateMatches));
                    localStorage.setItem(allDrawMatchesKey, JSON.stringify(nextUsedPairKeys));
                    document.getElementById('draw-result').innerHTML = drawHtml;
                    return;
                }
            }

            alert('Es gibt keine mögliche Paarung mehr für diese Auslosung. Bitte machen Sie einen Reset für diese Auslosung und versuchen Sie es erneut.');
        }

        function resetDraw() {
            const pageMatches = getStoredArray(currentDrawMatchesKey);
            const pageKeys = pageMatches
                .map(pairKeyFromDisplay)
                .filter(Boolean);
            const remainingGlobalMatches = getStoredArray(allDrawMatchesKey)
                .filter(globalKey => !pageKeys.includes(globalKey));

            localStorage.removeItem(currentDrawKey);
            localStorage.removeItem(currentDrawMatchesKey);
            localStorage.setItem(allDrawMatchesKey, JSON.stringify(remainingGlobalMatches));
            document.getElementById('draw-result').innerHTML = '';
            alert('Die Auslosung wurde zurückgesetzt.');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedDraw = localStorage.getItem(currentDrawKey);
            if (savedDraw) {
                document.getElementById('draw-result').innerHTML = savedDraw;
            }
        });
    </script>

    <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/watt-turnier-app/service-worker.js")
        .catch(err => console.log("SW registration failed", err));
    }
    </script>
